# Continuous integration (Task 23 follow-up): runs every automated check the
# project has on each push, so a regression is caught without anyone having to
# remember to run three separate test commands.
#
# Four independent jobs (they run in parallel and one failing does not hide
# the others). Everything is self-contained: no secrets, no external services -
# the tests use an in-memory H2 database (backend), mocked API modules
# (frontend) and a stand-in for the AI model (Python); the docker-stack job
# builds the production images and runs them with throwaway credentials.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older, still-running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot, JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw was committed without its executable bit (created on Windows).
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Runs the whole suite on the "test" profile (application-test.properties),
      # which uses in-memory H2 and throwaway secrets - CI needs neither a
      # Postgres instance nor DB_PASSWORD / JWT_SECRET.
      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --force

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  ai-service:
    name: AI service (FastAPI, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-ai/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The one test that runs the real U2-Net model skips itself here because
      # the model file is not on the runner (and it never downloads it).
      - name: Test
        run: python -m pytest -v

  # Task 24: the production images (backend/Dockerfile, frontend/Dockerfile) and
  # docker-compose.yml are not covered by any unit test, and the machine the
  # project is developed on has no Docker - so this job is what proves they build
  # and work together: real PostgreSQL (the Flyway migrations run from scratch),
  # the backend on the production profile, and the Caddy web tier in front.
  docker-stack:
    name: Docker stack (build + smoke test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A throwaway .env: random passwords, a mail host that is never contacted
      # (the app only connects to it when it sends an email).
      - name: Write a throwaway .env
        run: |
          cat > .env <<EOF
          SITE_ADDRESS=:80
          PUBLIC_URL=http://localhost
          DB_PASSWORD=ci-$(openssl rand -hex 12)
          JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
          SPRING_MAIL_HOST=localhost
          SPRING_MAIL_USERNAME=ci@example.com
          SPRING_MAIL_PASSWORD=unused
          EOF

      # --wait returns once every service with a health check is healthy (the
      # database, then the backend, which runs the migrations on start).
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Smoke test
        run: |
          set -eu
          # The React app is served, including a deep link a refresh would hit.
          curl -fsS http://localhost/ | grep -q 'id="root"'
          curl -fsS http://localhost/closet | grep -q 'id="root"'
          # The backend's health endpoint is not exposed to the public.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/actuator/health)" = 404
          # The API is reachable through the web tier: register a user...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/auth/register             -H 'Content-Type: application/json'             -d '{"email":"ci@example.com","password":"Sup3r-secret-pw","firstName":"C","lastName":"I"}')
          test "$code" = 200
          # ...broken JSON is a 400 (not a 500)...
          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost/api/auth/register             -H 'Content-Type: application/json' -d '{bad')
          test "$code" = 400
          # ...and a protected endpoint turns an anonymous caller away.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost/api/clothing)
          test "$code" = 403

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
