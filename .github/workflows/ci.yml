# Continuous integration (Task 23 follow-up): runs every automated check the
# project has on each push, so a regression is caught without anyone having to
# remember to run three separate test commands.
#
# Three independent jobs (they run in parallel and one failing does not hide
# the others). Everything is self-contained: no database, no secrets, no
# network services - the tests use an in-memory H2 database (backend), mocked
# API modules (frontend) and a stand-in for the AI model (Python).
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older, still-running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Spring Boot, JUnit)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw was committed without its executable bit (created on Windows).
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Runs the whole suite on the "test" profile (application-test.properties),
      # which uses in-memory H2 and throwaway secrets - CI needs neither a
      # Postgres instance nor DB_PASSWORD / JWT_SECRET.
      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (TypeScript, Vitest, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --force

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

  ai-service:
    name: AI service (FastAPI, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-ai/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The one test that runs the real U2-Net model skips itself here because
      # the model file is not on the runner (and it never downloads it).
      - name: Test
        run: python -m pytest -v
