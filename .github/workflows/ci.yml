# Continuous integration (Task 23 follow-up): runs every automated check the
# project has on each push, so a regression is caught without anyone having to
# remember to run three separate test commands.
#
# Five independent jobs (they run in parallel and one failing does not hide
# the others). Everything is self-contained: no secrets, no external services -
# the tests use an in-memory H2 database (backend), mocked API modules
# (frontend) and a stand-in for the AI model (Python); the docker-stack job
# builds the production images and runs them with throwaway credentials.
name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch makes the older, still-running one pointless.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Runner images are pinned to ubuntu-24.04 on purpose: "ubuntu-latest" moved to 26.04, which the pinned Playwright
# (1.56.1) cannot install its browser dependencies on. When Playwright is upgraded (Dependabot proposes it), move
# the images up deliberately, one job at a time, instead of having them change under the build.
jobs:
  backend:
    name: Backend (Spring Boot, JUnit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # mvnw was committed without its executable bit (created on Windows).
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw

      # Runs the whole suite on the "test" profile (application-test.properties),
      # which uses in-memory H2 and throwaway secrets - CI needs neither a
      # Postgres instance nor DB_PASSWORD / JWT_SECRET.
      - name: Test
        run: ./mvnw -B -ntp test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: backend-test-reports
          path: backend/target/surefire-reports
          if-no-files-found: ignore

  frontend:
    name: Frontend (TypeScript, Vitest, build)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc -b --force

      # Task 105: the end-to-end specs are outside the app's TypeScript project; check them too.
      # Audit M20: errors fail the build, and so does any NEW warning (the count below is today's).
      - name: Lint
        run: npm run lint

      - name: Type-check the end-to-end tests
        run: npm run e2e:typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # Task 100: first-load JavaScript must stay under budget and free of the editor libraries.
      - name: Bundle size guard
        run: npm run check:bundle

  # Task 105: the key flows in a real browser (Playwright, Chromium) against the real backend (test profile:
  # in-memory H2, nothing external) and the built website. Sign-up and sign-in, the 15-garment limit through the
  # upload screen, building and saving an outfit, sharing it by link, the cookie banner and the first-run guide.
  # Playwright starts both servers itself (see frontend/playwright.config.ts).
  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-24.04
    needs: frontend
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Make the Maven wrapper executable
        run: chmod +x ../backend/mvnw

      - name: Install dependencies
        run: npm ci

      - name: Install the browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests
        run: npm run e2e

      - name: Upload the report and traces on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          if-no-files-found: ignore

  ai-service:
    name: AI service (FastAPI, pytest)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: backend-ai
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend-ai/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The one test that runs the real U2-Net model skips itself here because
      # the model file is not on the runner (and it never downloads it).
      - name: Test
        run: python -m pytest -v

  # Task 24: the production images (backend/Dockerfile, frontend/Dockerfile) and
  # docker-compose.yml are not covered by any unit test, and the machine the
  # project is developed on has no Docker - so this job is what proves they build
  # and work together: real PostgreSQL (the Flyway migrations run from scratch),
  # the backend on the production profile, and the Caddy web tier in front.
  docker-stack:
    name: Docker stack (build + smoke test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # A throwaway .env: random passwords, a mail host that is never contacted
      # (the app only connects to it when it sends an email).
      # PUBLIC_URL is what the backend takes as its website address and allowed origin. The backend runs on the
      # production profile, whose start-up guard (ProductionSettingsGuard) refuses http and localhost there, so it
      # gets a public-looking https name that is never contacted. The stack itself is still reached on plain
      # http://localhost (SITE_ADDRESS=:80); curl sends no Origin header, so CORS plays no part in the smoke test.
      - name: Write a throwaway .env
        run: |
          cat > .env <<EOF
          SITE_ADDRESS=:80
          PUBLIC_URL=https://ci.example.test
          DB_PASSWORD=ci-$(openssl rand -hex 12)
          JWT_SECRET=$(openssl rand -base64 64 | tr -d '\n')
          SPRING_MAIL_HOST=localhost
          SPRING_MAIL_USERNAME=ci@example.com
          SPRING_MAIL_PASSWORD=unused
          EOF

      # --wait returns once every service with a health check is healthy (the
      # database, then the backend, which runs the migrations on start).
      - name: Build and start
        run: docker compose up -d --build --wait --wait-timeout 420

      # Every check says what it expects and what it got, runs even if an earlier one failed, and the step fails at the end if
      # any did, so one run shows ALL the problems (a bare `test` under `set -e` stopped at the first one without saying which).
      - name: Smoke test
        run: |
          set -u
          failed=0
          body=$(mktemp)
          check() { # name, expected, got
            if [ "$2" = "$3" ]; then
              echo "ok    $1: expected $2, got $3"
            else
              echo "FAIL  $1: expected $2, got $3"
              echo "      response body: $(head -c 400 "$body")"
              failed=1
            fi
          }
          # Prints the HTTP status of a request and keeps the response body for check(). Arguments are curl's.
          status() { curl -s -o "$body" -w '%{http_code}' "$@" || echo "curl-error"; }
          # Whether the response body of the last request holds the React root element.
          serves_app() { if grep -q 'id="root"' "$body"; then echo yes; else echo no; fi; }

          # The React app is served, including a deep link a refresh would hit.
          check "home page status" 200 "$(status http://localhost/)"
          check "home page is the React app" yes "$(serves_app)"
          check "deep link /closet status" 200 "$(status http://localhost/closet)"
          check "deep link /closet is the React app" yes "$(serves_app)"

          # The backend's health endpoint is not exposed to the public.
          check "actuator hidden from the public" 404 "$(status http://localhost/actuator/health)"

          # The API is reachable through the web tier: register a user. Since the age and consent rules (audit H12) a new account
          # needs a birth month and year, both acceptances and the version of the texts it saw, so the body carries all of them:
          # an obviously fake adult (born January 1990), the Terms and Privacy accepted, and the version the backend is built with.
          legal_version=$(sed -n 's/.*CURRENT = "\([^"]*\)".*/\1/p' backend/src/main/java/com/javier/closetapp/legal/LegalVersion.java)
          check "legal version found in the backend source" yes "$([ -n "$legal_version" ] && echo yes || echo no)"
          register='{"email":"ci@example.com","password":"Sup3r-secret-pw","firstName":"C","lastName":"I","birthMonth":1,"birthYear":1990,"guardianAuthorized":false,"termsAccepted":true,"dataAuthorized":true,"legalVersion":"'"$legal_version"'"}'
          check "register through the web tier" 200 "$(status -X POST http://localhost/api/auth/register -H 'Content-Type: application/json' -d "$register")"

          # ...broken JSON is a 400 (not a 500)...
          check "broken JSON is a 400" 400 "$(status -X POST http://localhost/api/auth/register -H 'Content-Type: application/json' -d '{bad')"

          # ...and a protected endpoint turns an anonymous caller away (401 since Task 95; it was an empty 403).
          check "anonymous protected endpoint is a 401" 401 "$(status http://localhost/api/clothing)"

          if [ "$failed" -ne 0 ]; then echo "Smoke test FAILED: see the FAIL lines above."; exit 1; fi
          echo "Smoke test passed."

      - name: Show logs on failure
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
