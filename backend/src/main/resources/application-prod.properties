# Production profile (Task 24). Selected with SPRING_PROFILES_ACTIVE=prod (the
# Docker image sets it), which replaces application.properties'
# spring.profiles.active=local - so application-local.properties is never read
# in production. Required environment variables (the app refuses to start without
# them): DB_PASSWORD, JWT_SECRET; and for email: spring.mail.host / username /
# password (SPRING_MAIL_HOST, SPRING_MAIL_USERNAME, SPRING_MAIL_PASSWORD).
# See DEPLOYMENT.md.

# Quiet logs: no SQL echo, no request/security tracing (the dev defaults print
# every statement and bound value, which includes personal data).
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
logging.level.root=INFO
logging.level.org.springframework.security=WARN
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.type.descriptor.sql=OFF

# Database connections. A free managed Postgres (Neon) allows few connections and
# closes idle ones, so keep the pool small and retire connections before the
# server drops them (5 minutes) instead of handing out a dead one.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000

# Real email only: the "log" mailer prints password-reset links (credentials)
# to the console. Setting MAIL_MODE=log in production is therefore not possible
# by accident - it has to be done on purpose.
app.mail.mode=${MAIL_MODE:smtp}

# Behind the reverse proxy (Caddy): trust X-Forwarded-* so redirects and
# generated links use the public https address.
server.forward-headers-strategy=framework

# An existing database that has no Flyway history is an error in production, not
# something to silently adopt (baseline-on-migrate is for the original dev DB).
spring.flyway.baseline-on-migrate=false

# Never put exception messages or stack traces in error responses.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
