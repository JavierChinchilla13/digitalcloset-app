# Database Configuration
# Task 24: DB_URL / DB_USERNAME let a deployment point at its own database (a
# managed one needs its own host and usually ?sslmode=require); the defaults are
# the local dev database.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/closet_db}
spring.datasource.username=${DB_USERNAME:postgres}
# Externalized: resolved from the DB_PASSWORD env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Never hardcode a real value here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Schema is now Flyway-managed (see below) - Hibernate only validates entities
# against it at startup, it no longer auto-generates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
# baseline-on-migrate lets Flyway adopt an existing, already-evolved database
# (built up previously via ddl-auto=update) without re-running V1's CREATE TABLE
# statements against it - it just records the DB as already being at
# baseline-version. A genuinely empty database (fresh clone, CI, tests) is not
# affected by baselining and runs V1 normally, ending up with the same schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# App Configuration
# Externalized: resolved from the JWT_SECRET env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Must be a real Base64-encoded value
# (e.g. generated with `openssl rand -base64 64`), not a hex string - JwtService decodes it
# as Base64 to derive the HS256 signing key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Task 24: platforms like Render tell the app which port to listen on through
# the PORT environment variable; 8080 otherwise (dev, docker-compose).
server.port=${PORT:8080}

# Task 24: request limit on the public account endpoints (/api/auth/**: login,
# register, forgot-password, reset-password), per client IP. Beyond max-requests
# in one window the caller gets 429 + Retry-After. RATE_LIMIT_ENABLED=false turns
# it off (never do that in production).
app.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.rate-limit.auth.max-requests=${RATE_LIMIT_AUTH_MAX:30}
app.rate-limit.auth.window-seconds=60

# Task 96: garments an account may keep (photos sit on free Cloudinary storage). Admins are unlimited.
app.limits.garments.free=${GARMENT_LIMIT_FREE:15}
app.limits.garments.premium=${GARMENT_LIMIT_PREMIUM:300}

# Task 98: "Sign in with Google". The OAuth client id (public, ends in .apps.googleusercontent.com) from
# Google Cloud Console; the same value the site is built with (VITE_GOOGLE_CLIENT_ID). Blank = Google
# sign-in is off. No client secret is needed: the browser's ID token is checked against Google's public keys.
app.google.client-id=${GOOGLE_CLIENT_ID:}

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
# Comma-separated allowed origins for cross-origin requests (see SecurityConfig).
# Not a secret - override via the CORS_ALLOWED_ORIGINS env var in any deployed
# environment to point at the real frontend domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Password reset (Task 21)
# Public URL of the frontend - used to build the link in the reset email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# How emails are delivered. "log" (the default) only prints the link / code to
# the backend console - DEV ONLY, they are credentials. The production profile
# (application-prod.properties, Task 24) defaults to "smtp". Three modes:
#   log   - console only (dev)
#   smtp  - a normal SMTP account (spring.mail.* below); needs SMTP ports open
#   relay - Task 94: HTTPS to a Google Apps Script that sends from the owner's
#           Gmail (scripts/mail-relay.gs). For hosts that block SMTP, like Render's
#           free tier, and for owners without a domain.
app.mail.mode=${MAIL_MODE:log}
# "relay" mode: the Apps Script web app URL and the shared secret (set both as env
# vars when deployed; the app refuses to start in relay mode without them).
app.mail.relay.url=${MAIL_RELAY_URL:}
app.mail.relay.secret=${MAIL_RELAY_SECRET:}
# "smtp" mode: the account is set with spring.mail.host / port / username /
# password (put them in application-local.properties locally, env vars when
# deployed - see application-local.properties.example). Port 587 + STARTTLS is
# the standard submission setup and works for Gmail, SendGrid, Resend, etc.
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# From address on reset emails. Many providers (Gmail) require it to be the
# authenticated account, so it defaults to the SMTP username.
app.mail.from=${MAIL_FROM:${spring.mail.username:noreply@localhost}}
# Who the emails say they're from / how to reach them (shown in the email's
# signature and used as Reply-To). Public contact details, not secrets.
app.brand.owner-name=Javier Chinchilla Lugo
app.brand.owner-title=Creator of VYSVI
app.brand.contact-email=javidilugo@gmail.com
app.password-reset.expiration-minutes=30
app.password-reset.min-interval-seconds=60

# Email/password-change confirmation codes (Task 79 follow-up). Short-lived
# on purpose - unlike a reset link the user is meant to act on this within a
# minute or two, right after submitting the form. min-interval throttles
# "Resend"; max-attempts invalidates a code after that many wrong guesses
# (there's no per-IP limit anywhere in this app - see PROJECT_BLUEPRINT.md -
# so this is the only thing standing between a code and brute force).
app.account-verification.expiration-minutes=10
app.account-verification.min-interval-seconds=60
app.account-verification.max-attempts=5

# Task 24: health check for the hosting platform. Only "health" is exposed (no
# env, beans, metrics...), without details, and the mail check is off so a slow
# SMTP server can never make the platform restart a healthy app.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.health.mail.enabled=false
# Finish in-flight requests before stopping (a redeploy shouldn't cut them off).
server.shutdown=graceful

# Activates application-local.properties by default so the app runs locally with zero setup.
# Environment variables (DB_PASSWORD, JWT_SECRET) always take precedence over this file's
# values regardless of which profile is active, so deployed environments stay safe as long
# as they set those env vars - they do not need to unset this property.
spring.profiles.active=local
