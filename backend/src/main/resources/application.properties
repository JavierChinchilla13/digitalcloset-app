# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/closet_db
spring.datasource.username=postgres
# Externalized: resolved from the DB_PASSWORD env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Never hardcode a real value here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Schema is now Flyway-managed (see below) - Hibernate only validates entities
# against it at startup, it no longer auto-generates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
# baseline-on-migrate lets Flyway adopt an existing, already-evolved database
# (built up previously via ddl-auto=update) without re-running V1's CREATE TABLE
# statements against it - it just records the DB as already being at
# baseline-version. A genuinely empty database (fresh clone, CI, tests) is not
# affected by baselining and runs V1 normally, ending up with the same schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# App Configuration
# Externalized: resolved from the JWT_SECRET env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Must be a real Base64-encoded value
# (e.g. generated with `openssl rand -base64 64`), not a hex string - JwtService decodes it
# as Base64 to derive the HS256 signing key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
# Comma-separated allowed origins for cross-origin requests (see SecurityConfig).
# Not a secret - override via the CORS_ALLOWED_ORIGINS env var in any deployed
# environment to point at the real frontend domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Activates application-local.properties by default so the app runs locally with zero setup.
# Environment variables (DB_PASSWORD, JWT_SECRET) always take precedence over this file's
# values regardless of which profile is active, so deployed environments stay safe as long
# as they set those env vars - they do not need to unset this property.
spring.profiles.active=local
