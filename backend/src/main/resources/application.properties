# Database Configuration
spring.datasource.url=jdbc:postgresql://localhost:5432/closet_db
spring.datasource.username=postgres
# Externalized: resolved from the DB_PASSWORD env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Never hardcode a real value here.
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate Configuration
# Schema is now Flyway-managed (see below) - Hibernate only validates entities
# against it at startup, it no longer auto-generates or alters tables.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Configuration
# baseline-on-migrate lets Flyway adopt an existing, already-evolved database
# (built up previously via ddl-auto=update) without re-running V1's CREATE TABLE
# statements against it - it just records the DB as already being at
# baseline-version. A genuinely empty database (fresh clone, CI, tests) is not
# affected by baselining and runs V1 normally, ending up with the same schema.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Logging
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.type.descriptor.sql=TRACE

# App Configuration
# Externalized: resolved from the JWT_SECRET env var, or from application-local.properties
# (gitignored) when the "local" profile is active. Must be a real Base64-encoded value
# (e.g. generated with `openssl rand -base64 64`), not a hex string - JwtService decodes it
# as Base64 to derive the HS256 signing key.
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=86400000

# Multipart Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# CORS Configuration
# Comma-separated allowed origins for cross-origin requests (see SecurityConfig).
# Not a secret - override via the CORS_ALLOWED_ORIGINS env var in any deployed
# environment to point at the real frontend domain.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Password reset (Task 21)
# Public URL of the frontend - used to build the link in the reset email.
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
# How the reset email is delivered. "log" (the default) only prints the link to
# the backend console - DEV ONLY, the link is a credential. A real mailer
# (SMTP) must be added and selected here before any deployment (Task 24).
app.mail.mode=${MAIL_MODE:log}
# "smtp" mode: the account is set with spring.mail.host / port / username /
# password (put them in application-local.properties locally, env vars when
# deployed - see application-local.properties.example). Port 587 + STARTTLS is
# the standard submission setup and works for Gmail, SendGrid, Resend, etc.
spring.mail.port=${MAIL_PORT:587}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
# From address on reset emails. Many providers (Gmail) require it to be the
# authenticated account, so it defaults to the SMTP username.
app.mail.from=${MAIL_FROM:${spring.mail.username:noreply@localhost}}
# Who the emails say they're from / how to reach them (shown in the email's
# signature and used as Reply-To). Public contact details, not secrets.
app.brand.owner-name=Javier Chinchilla Lugo
app.brand.owner-title=Creator of VYSVI
app.brand.contact-email=javidilugo@gmail.com
app.password-reset.expiration-minutes=30
app.password-reset.min-interval-seconds=60

# Activates application-local.properties by default so the app runs locally with zero setup.
# Environment variables (DB_PASSWORD, JWT_SECRET) always take precedence over this file's
# values regardless of which profile is active, so deployed environments stay safe as long
# as they set those env vars - they do not need to unset this property.
spring.profiles.active=local
