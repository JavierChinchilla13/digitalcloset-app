# Test profile (Task 23). Activated by @ActiveProfiles("test") on the integration
# tests, which REPLACES main's spring.profiles.active=local - so
# application-local.properties (real DB password, JWT secret, SMTP login) is
# never loaded by the test suite. Everything below is a throwaway test value.

# In-memory H2 speaking PostgreSQL's dialect.
spring.datasource.url=jdbc:h2:mem:closet_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false
# Hibernate builds the schema from the entities and Flyway is off, because
# V3__add_collections.sql uses a Postgres-only functional index
# (lower(name)) that H2 cannot parse. Consequences to be aware of: these tests
# do not exercise the migration scripts themselves (the real dev database still
# runs them, with ddl-auto=validate as the entity/schema check), and the
# case-insensitive unique collection name index does not exist here.
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# Test-only signing key (Base64). Not a real secret.
app.jwt.secret=dGVzdC1vbmx5LWp3dC1zZWNyZXQtbm90LXVzZWQtYW55d2hlcmUtZWxzZS0wMTIzNDU2Nzg5LWFiY2RlZmdoaWo=
app.jwt.expiration-ms=3600000

app.mail.mode=log
logging.level.org.springframework.web=WARN
logging.level.org.hibernate.type.descriptor.sql=OFF
