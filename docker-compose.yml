# Task 24: the whole app on one machine - database, API and web server.
#
#   cp .env.production.example .env     # then fill it in
#   docker compose up -d --build
#
# See DEPLOYMENT.md. Only the web container is reachable from outside (ports 80
# and 443); the database and the API live on the private compose network.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: closet_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d closet_db"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/closet_db
      DB_USERNAME: postgres
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env (openssl rand -base64 64)}
      # Same origin (Caddy serves the site and proxies /api), so CORS is not
      # exercised; kept accurate anyway.
      CORS_ALLOWED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env}
      FRONTEND_URL: ${PUBLIC_URL}
      # Email. MAIL_MODE defaults to smtp in the prod profile.
      SPRING_MAIL_HOST: ${SPRING_MAIL_HOST:?Set SPRING_MAIL_HOST in .env}
      SPRING_MAIL_PORT: ${SPRING_MAIL_PORT:-587}
      SPRING_MAIL_USERNAME: ${SPRING_MAIL_USERNAME:?Set SPRING_MAIL_USERNAME in .env}
      SPRING_MAIL_PASSWORD: ${SPRING_MAIL_PASSWORD:?Set SPRING_MAIL_PASSWORD in .env}
      MAIL_FROM: ${MAIL_FROM:-${SPRING_MAIL_USERNAME}}
      # Task 98: Google sign-in (empty = off; the site is built with the same value).
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      # Cap the JVM if the machine is small (default: 70% of the container's RAM).
      JAVA_TOOL_OPTIONS: ${JAVA_TOOL_OPTIONS:--XX:MaxRAMPercentage=70}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  web:
    build:
      context: ./frontend
      args:
        VITE_CLOUDINARY_CLOUD_NAME: ${VITE_CLOUDINARY_CLOUD_NAME:-}
        VITE_CLOUDINARY_UPLOAD_PRESET: ${VITE_CLOUDINARY_UPLOAD_PRESET:-}
        VITE_BG_REMOVER_MODE: ${VITE_BG_REMOVER_MODE:-browser}
        # Task 98: "Sign in with Google" (empty = no button). The backend needs the same value as GOOGLE_CLIENT_ID.
        VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
        # Task 97: ads for free accounts (all empty = off).
        VITE_AD_PROVIDER: ${VITE_AD_PROVIDER:-}
        VITE_ADSENSE_CLIENT: ${VITE_ADSENSE_CLIENT:-}
        VITE_ADSENSE_SLOT: ${VITE_ADSENSE_SLOT:-}
        VITE_ADSTERRA_SCRIPT_URL: ${VITE_ADSTERRA_SCRIPT_URL:-}
        VITE_ADSTERRA_KEY: ${VITE_ADSTERRA_KEY:-}
        VITE_ADSTERRA_WIDTH: ${VITE_ADSTERRA_WIDTH:-}
        VITE_ADSTERRA_HEIGHT: ${VITE_ADSTERRA_HEIGHT:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    environment:
      # The public hostname (closet.example.com) turns on automatic HTTPS;
      # ":80" is plain HTTP, for trying it on your own machine.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
