<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Task 74: the real VYSVI "V" ribbon mark, auto-cropped from
         public/logo.png (which is already a transparent PNG - see
         PROJECT_BLUEPRINT.md Phase 9.7 for how that was verified). Replaces
         the old placeholder favicon.svg (left in public/, unreferenced). -->
    <link rel="icon" type="image/png" sizes="any" href="/favicon.png" />
    <!-- Task 90: installable on a phone ("Add to Home Screen"): a web-app
         manifest (name, icons, standalone display, opens on /showcase), the iOS
         equivalents, and the browser-bar colour. viewport-fit=cover lets the
         layout use the screen under a notch (the CSS adds the safe-area insets). -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VYSVI" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0B0B0C" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#F6F5F3" media="(prefers-color-scheme: light)" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <title>VYSVI — Digital Wardrobe</title>
    <!-- Task 67: apply the saved theme - or, if the user never picked one,
         the device's - before first paint so the page never flashes the wrong
         one. Same key + rule as src/store/useThemeStore.ts, which takes over
         once the app boots. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('vysvi-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'light' || pref === 'dark' ? pref : dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
