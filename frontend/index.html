<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Task 74: the real VYSVI "V" ribbon mark, auto-cropped from
         public/logo.png (which is already a transparent PNG - see
         PROJECT_BLUEPRINT.md Phase 9.7 for how that was verified). Replaces
         the old placeholder favicon.svg (left in public/, unreferenced). -->
    <link rel="icon" type="image/png" sizes="any" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>VYSVI — Digital Wardrobe</title>
    <!-- Task 67: apply the saved / device theme before first paint so the
         page never flashes the wrong one. Same key + rule as
         src/store/useThemeStore.ts, which takes over once the app boots. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('vysvi-theme');
          var dark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          var theme = pref === 'light' || pref === 'dark' ? pref : dark ? 'dark' : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
