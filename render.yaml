# Task 24: Render "Blueprint" - creates the backend and the website on Render's free
# plan in one go (New + -> Blueprint -> pick this repo). The DATABASE is not here:
# Render's free Postgres expires after 30 days, so use Neon (free, no expiry) and
# paste its connection details below. Step by step: DEPLOYMENT.md, section
# "Free hosting with Render + Neon".
#
# Values marked sync:false are asked for in the dashboard (never stored in git).
services:
  # ---- the API ----
  - type: web
    name: vysvi-api
    runtime: docker
    plan: free
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /actuator/health
    envVars:
      # Neon: the DIRECT connection (host without "-pooler"), as a JDBC URL:
      #   jdbc:postgresql://ep-xxxx.region.aws.neon.tech/neondb?sslmode=require
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      # Signs the login tokens; must be Base64. Paste the output of:
      #   openssl rand -base64 64
      - key: JWT_SECRET
        sync: false
      # The website's address, e.g. https://vysvi.onrender.com (no trailing slash).
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Render's free tier blocks outbound SMTP (ports 25/465/587), so email goes
      # through a Google Apps Script web app that sends from your Gmail over HTTPS
      # (scripts/mail-relay.gs; setup in DEPLOYMENT.md, "Email without SMTP").
      - key: MAIL_MODE
        value: relay
      - key: MAIL_RELAY_URL
        sync: false
      - key: MAIL_RELAY_SECRET
        sync: false
      # A free instance has little memory: keep the JVM inside it.
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx320m -XX:+UseSerialGC -XX:TieredStopAtLevel=1"

  # ---- the website (static files) ----
  - type: web
    name: vysvi-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    envVars:
      # The API's address + /api, e.g. https://vysvi-api.onrender.com/api. Baked
      # into the site when it is built, so redeploy the site after changing it.
      - key: VITE_API_URL
        sync: false
      - key: VITE_CLOUDINARY_CLOUD_NAME
        sync: false
      - key: VITE_CLOUDINARY_UPLOAD_PRESET
        sync: false
      - key: VITE_BG_REMOVER_MODE
        value: browser
      # Ads for free accounts (Task 97). Leave VITE_AD_PROVIDER empty to keep ads off; see
      # DEPLOYMENT.md, "Ads for free accounts". Public values, baked in at build time.
      - key: VITE_AD_PROVIDER
        sync: false
      - key: VITE_ADSENSE_CLIENT
        sync: false
      - key: VITE_ADSENSE_SLOT
        sync: false
      - key: VITE_ADSTERRA_SCRIPT_URL
        sync: false
      - key: VITE_ADSTERRA_KEY
        sync: false
      - key: VITE_ADSTERRA_WIDTH
        sync: false
      - key: VITE_ADSTERRA_HEIGHT
        sync: false
      - key: NODE_VERSION
        value: "24"
    routes:
      # Single-page app: any path (a refresh on /closet) serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
